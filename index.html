<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wavelength</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        :root { --bg: #0a0a0c; --bg-elevated: #16161a; --gold: #c9a96e; --line: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 20px; display: flex; gap: 10px; border-bottom: 1px solid var(--line); }
        input { flex: 1; background: var(--bg-elevated); border: 1px solid var(--line); color: #fff; padding: 10px; border-radius: 8px; }
        button { background: var(--gold); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #cover { width: 300px; height: 300px; border-radius: 20px; object-fit: cover; margin-bottom: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .info { text-align: center; margin-bottom: 20px; }
        #queue { position: fixed; right: 0; top: 0; bottom: 0; width: 300px; background: var(--bg-elevated); transform: translateX(100%); transition: 0.3s; padding: 20px; overflow-y: auto; z-index: 100; }
        #queue.open { transform: translateX(0); }
        .item { display: flex; gap: 10px; margin-bottom: 15px; cursor: pointer; font-size: 14px; align-items: center; }
        .item img { width: 50px; height: 30px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <input type="text" id="q" placeholder="Search...">
    <button onclick="doSearch()" id="btn">Search</button>
    <button onclick="document.getElementById('queue').classList.toggle('open')">☰</button>
</header>

<div id="main">
    <img id="cover" src="https://via.placeholder.com/300">
    <div class="info">
        <h2 id="title">Ready</h2>
        <p id="author">Select a track</p>
    </div>
    <div style="display:flex; gap:20px;">
        <button onclick="prev()">⏮</button>
        <button onclick="toggle()" id="playBtn" style="font-size: 24px;">▶</button>
        <button onclick="next()">⏭</button>
    </div>
</div>

<div id="queue"><h3>Next Up</h3><div id="list"></div></div>

<script>
    const audio = new Audio();
    let queue = [], curIdx = -1;

    async function doSearch() {
        const q = document.getElementById('q').value;
        document.getElementById('btn').innerText = "...";
        const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
        queue = await res.json();
        document.getElementById('list').innerHTML = queue.map((t, i) => `
            <div class="item" onclick="play(${i})">
                <img src="${t.thumb}">
                <div>${t.title.substring(0,30)}...</div>
            </div>
        `).join('');
        document.getElementById('btn').innerText = "Search";
        document.getElementById('queue').classList.add('open');
    }

    function play(idx) {
        if (idx < 0 || idx >= queue.length) return;
        curIdx = idx;
        const t = queue[idx];
        document.getElementById('title').innerText = t.title;
        document.getElementById('author').innerText = t.author;
        document.getElementById('cover').src = t.thumb;
        document.getElementById('playBtn').innerText = "⏸";

        // Reset and Load
        audio.pause();
        audio.src = `/stream?videoId=${t.id}`;
        audio.load();
        audio.play().catch(e => console.error("Playback error:", e));
    }

    function toggle() {
        if (audio.paused) { audio.play(); document.getElementById('playBtn').innerText = "⏸"; }
        else { audio.pause(); document.getElementById('playBtn').innerText = "▶"; }
    }

    function next() { play(curIdx + 1); }
    function prev() { play(curIdx - 1); }

    audio.onended = () => next();
</script>
</body>
</html>
