<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Wavelength</title>

<!-- PWA / iOS Specific -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a0a0c" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=DM+Mono:wght@300;400&family=Syne:wght@400;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0a0a0c; --bg2: #111115; --bg3: #18181e; 
    --gold: #c9a96e; --gold2: #e8c98a; 
    --line: rgba(255, 255, 255, 0.07); --line2: rgba(255, 255, 255, 0.12);
    --text: #f0ede8; --text2: #9b9890; --text3: #5a5855;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --control-h: 180px; /* Exact height for the control block */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body { 
    height: 100%; height: 100dvh; 
    background: var(--bg); color: var(--text); 
    font-family: var(--font-ui); overflow: hidden; 
    -webkit-tap-highlight-color: transparent;
  }

  /* Main Wrapper */
  #app {
    display: flex; flex-direction: column;
    height: 100dvh; width: 100%;
    position: relative;
  }

  /* Header stays at top */
  #header {
    flex-shrink: 0;
    padding: calc(var(--safe-top) + 15px) 20px 15px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line); background: var(--bg);
    z-index: 100;
  }

  .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-style: italic; }
  .logo span { color: var(--gold); font-style: normal; }

  .search-wrap { flex: 1; display: flex; background: var(--bg3); border-radius: 6px; border: 1px solid var(--line2); }
  #q { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 10px; font-size: 14px; }
  #searchBtn { background: transparent; border: none; color: var(--gold); padding: 0 15px; font-family: 'DM Mono', monospace; font-size: 10px; }

  /* Main Viewport (Visualizer/Cover) */
  #main-view {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  #cover-img { 
    width: 100%; height: 100%; object-fit: cover; 
    opacity: 0.4; transition: opacity 0.5s ease;
  }

  /* FIXED BOTTOM CONTROLS - Locked to bottom */
  #controls-container {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: var(--control-h);
    background: linear-gradient(to top, var(--bg) 80%, transparent);
    padding: 20px 25px calc(var(--safe-bottom) + 15px);
    display: flex; flex-direction: column; justify-content: space-between;
    z-index: 200;
  }

  .track-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-ch { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--gold); text-transform: uppercase; }

  #prog-bar-container { width: 100%; height: 20px; display: flex; align-items: center; cursor: pointer; }
  #prog-bg { width: 100%; height: 2px; background: var(--line2); position: relative; }
  #prog-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: var(--gold); }

  .btn-row { display: flex; align-items: center; justify-content: center; gap: 35px; }
  .cb { background: transparent; border: 1px solid var(--line2); color: var(--text); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .cb.lg { width: 60px; height: 60px; border-color: var(--gold); }
  .cb.sm { width: 44px; height: 44px; }

  /* Sidebar Overlay */
  #sidebar {
    position: fixed; top: 0; right: 0; bottom: 0; width: 85%; max-width: 320px;
    background: var(--bg2); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 300; display: flex; flex-direction: column;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 250; }
  #sidebar-backdrop.active { opacity: 1; pointer-events: auto; }

  #queue-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 40px; }
  .q-item { display: flex; align-items: center; gap: 12px; padding: 15px; border-bottom: 1px solid var(--line); }
  .q-item.active { background: rgba(201, 169, 110, 0.1); border-right: 3px solid var(--gold); }
  .q-thumb { width: 45px; height: 30px; object-fit: cover; border-radius: 2px; }
  .q-details { flex: 1; overflow: hidden; }
  .q-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

</style>
</head>
<body>

<div id="app">
  <header id="header">
    <div class="logo">Wave<span>length</span></div>
    <div class="search-wrap">
      <input type="text" id="q" placeholder="Artist or song..." autocomplete="off" />
      <button id="searchBtn">SEARCH</button>
    </div>
    <button id="menuBtn" style="background:none; border:none; color:var(--gold); font-size:24px; padding-left:10px;">☰</button>
  </header>

  <main id="main-view">
    <img id="cover-img" src="" alt="" />
    
    <!-- Controls are absolute-positioned inside main view to ensure they never move -->
    <div id="controls-container">
      <div class="info">
        <div class="track-title" id="np-title">Wavelength</div>
        <div class="track-ch" id="np-ch">System Ready</div>
      </div>

      <div id="prog-bar-container">
        <div id="prog-bg"><div id="prog-fill"></div></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-family:'DM Mono'; font-size:9px; color:var(--text3); margin-top:-12px; margin-bottom: 5px;">
          <span id="tc">0:00</span><span id="td">0:00</span>
      </div>

      <div class="btn-row">
        <button class="cb sm" id="prevBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="cb lg" id="ppBtn">
          <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" style="display:none" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="cb sm" id="nextBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg></button>
      </div>
    </div>
  </main>

  <div id="sidebar-backdrop"></div>
  <aside id="sidebar">
    <div style="padding:20px; font-family:'DM Mono'; border-bottom:1px solid var(--line); display:flex; justify-content:space-between;">
      <span>QUEUE</span>
      <button id="closeBtn" style="background:none; border:none; color:#fff;">✕</button>
    </div>
    <div id="queue-list"></div>
  </aside>
</div>

<script>
'use strict';

const PROXY = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? `http://${location.hostname}:3001` : '';
const $ = id => document.getElementById(id);

let queue = [], curIdx = -1, gestureUnlocked = false;

const audio = new Audio();
audio.preload = 'auto';
audio.setAttribute('playsinline', 'true');

function unlock() {
  if (gestureUnlocked) return;
  audio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
  audio.play().then(() => { gestureUnlocked = true; }).catch(()=>{});
}

function loadAndPlay(idx) {
  if (idx < 0 || idx >= queue.length) return;
  unlock();
  
  curIdx = idx;
  const item = queue[idx];
  
  $('np-title').textContent = item.title;
  $('np-ch').textContent = item.author;
  $('cover-img').src = item.thumb;
  $('cover-img').style.opacity = "0.6";
  
  audio.pause();
  audio.src = `${PROXY}/stream?videoId=${item.id}&t=${Date.now()}`;
  
  audio.play().then(() => {
    updateBtn(true);
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.title, artist: item.author,
        artwork: [{ src: item.thumb, sizes: '512x512', type: 'image/jpeg' }]
      });
    }
  }).catch(e => console.error("Playback failed", e));
  
  renderQueue();
  closeSidebar();
}

function updateBtn(playing) {
  $('playIcon').style.display = playing ? 'none' : 'block';
  $('pauseIcon').style.display = playing ? 'block' : 'none';
}

audio.ontimeupdate = () => {
  if (isNaN(audio.duration)) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  $('prog-fill').style.width = pct + '%';
  $('tc').textContent = fmt(audio.currentTime);
  $('td').textContent = fmt(audio.duration);
};

audio.onended = () => { if (curIdx < queue.length - 1) loadAndPlay(curIdx + 1); };

$('ppBtn').onclick = () => {
  unlock();
  if (!audio.src || audio.src.startsWith('data:')) return;
  if (audio.paused) { audio.play(); updateBtn(true); } 
  else { audio.pause(); updateBtn(false); }
};

$('nextBtn').onclick = () => { if (curIdx < queue.length - 1) loadAndPlay(curIdx + 1); };
$('prevBtn').onclick = () => { if (curIdx > 0) loadAndPlay(curIdx - 1); };

$('searchBtn').onclick = async () => {
  const val = $('q').value.trim();
  if (!val) return;
  
  try {
    const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(val)}&sp=EgIQAQ%3D%3D`;
    const r = await fetch(`${PROXY}/proxy?url=${encodeURIComponent(ytUrl)}`);
    const html = await r.text();
    
    const ids = [], re = /"videoId":"([a-zA-Z0-9_-]{11})"/g;
    let m;
    while ((m = re.exec(html)) !== null && ids.length < 15) {
      if (!ids.includes(m[1])) ids.push(m[1]);
    }

    queue = ids.map(id => ({ id, title: "Loading...", author: "", thumb: `https://i.ytimg.com/vi/${id}/mqdefault.jpg` }));
    renderQueue();
    openSidebar();

    queue.forEach(async (item, i) => {
      const mr = await fetch(`${PROXY}/proxy?url=${encodeURIComponent('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+item.id)}`);
      const d = await mr.json();
      item.title = d.title; item.author = d.author_name;
      renderQueue();
    });
  } catch (e) { console.error("Search Error", e); }
};

function renderQueue() {
  $('queue-list').innerHTML = queue.map((item, i) => `
    <div class="q-item ${i === curIdx ? 'active' : ''}" onclick="loadAndPlay(${i})">
      <img class="q-thumb" src="${item.thumb}">
      <div class="q-details">
        <div class="q-name">${item.title}</div>
      </div>
    </div>
  `).join('');
}

function fmt(s) { const m=Math.floor(s/60), sec=Math.floor(s%60); return m+":"+sec.toString().padStart(2,'0'); }
function openSidebar() { $('sidebar').classList.add('open'); $('sidebar-backdrop').classList.add('active'); }
function closeSidebar() { $('sidebar').classList.remove('open'); $('sidebar-backdrop').classList.remove('active'); }

$('menuBtn').onclick = openSidebar;
$('closeBtn').onclick = closeSidebar;
$('sidebar-backdrop').onclick = closeSidebar;

</script>
</body>
</html>
