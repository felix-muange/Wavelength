<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wavelength</title>
    <style>
        :root { 
            --bg: #0a0a0c; 
            --card: rgba(255, 255, 255, 0.08); 
            --gold: #c9a96e; 
            --text: #ffffff; 
            /* Strict Layering Control */
            --layer-bg: 1;
            --layer-main: 10;
            --layer-overlay: 100;
            --layer-sidebar: 500; /* Sidebar must be higher than header */
            --layer-header: 400;  /* Header lower than sidebar when open */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: -apple-system, system-ui, sans-serif; 
            height: 100dvh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; 
        }

        /* Fixed Background */
        .blur-bg { 
            position: fixed; inset: 0; z-index: var(--layer-bg); 
            background-size: cover; background-position: center; 
            filter: blur(60px) brightness(0.3); opacity: 0.6;
        }

        /* Header (Z-400) */
        header { 
            position: fixed; top: 0; left: 0; right: 0;
            z-index: var(--layer-header); 
            padding: env(safe-area-inset-top, 20px) 20px 15px; 
            display: flex; gap: 12px; align-items: center;
            background: linear-gradient(to bottom, rgba(10,10,12,0.8), transparent);
        }

        .search-box { 
            flex: 1; display: flex; background: var(--card); 
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
            padding: 4px 15px; backdrop-filter: blur(15px);
        }

        input { flex: 1; background: none; border: none; color: white; padding: 12px 0; font-size: 16px; outline: none; }

        /* Main Player (Z-10) */
        main { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            position: relative; z-index: var(--layer-main); padding-top: 80px;
        }

        #cover { 
            width: min(65vw, 280px); height: min(65vw, 280px); 
            border-radius: 20px; object-fit: cover; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.8); margin-bottom: 20px; 
        }

        /* Overlay (Z-100) */
        #overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            opacity: 0; pointer-events: none; transition: 0.3s; 
            z-index: var(--layer-overlay); 
        }
        #overlay.active { opacity: 1; pointer-events: auto; }

        /* SIDEBAR (Z-500 - HIGHEST) */
        #sidebar { 
            position: fixed; top: 0; right: 0; bottom: 0; 
            width: 85%; max-width: 400px; 
            background: #0f0f11; 
            z-index: var(--layer-sidebar);
            transform: translateX(100%); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            box-shadow: -15px 0 50px rgba(0,0,0,1);
        }
        #sidebar.open { transform: translateX(0); }

        /* This container ensures the close button is never blocked */
        .sidebar-controls {
            padding: env(safe-area-inset-top, 20px) 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: #16161a;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .btn-close {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 45px; height: 45px; border-radius: 50%;
            font-size: 20px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }

        .play-pause { 
            width: 75px; height: 75px; border-radius: 50%; 
            background: var(--gold); border: none; font-size: 30px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(201, 169, 110, 0.3);
        }

        .track-item { 
            display: flex; align-items: center; gap: 15px; padding: 15px; 
            border-radius: 12px; cursor: pointer; margin-bottom: 8px;
            background: rgba(255,255,255,0.03);
        }
        .track-item:active { background: rgba(255,255,255,0.1); }
        .track-item img { width: 50px; height: 50px; border-radius: 8px; }

        #health-dot { width: 10px; height: 10px; border-radius: 50%; background: #333; margin-right: 8px; }
        .online { background: #4caf50 !important; box-shadow: 0 0 12px #4caf50; }
    </style>
</head>
<body>

    <div class="blur-bg" id="blurBg"></div>
    <div id="overlay"></div>

    <header>
        <div id="health-dot"></div>
        <div class="search-box">
            <input type="text" id="query" placeholder="Search music..." autocomplete="off">
            <button onclick="search()" style="background:none; border:none; cursor:pointer; font-size:18px;">🔍</button>
        </div>
        <button onclick="openSidebar()" style="background:none; border:none; color:var(--gold); font-size:32px; padding-left:10px; cursor:pointer;">☰</button>
    </header>

    <main>
        <img id="cover" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
        <h2 id="title" style="margin:0; text-align:center; padding:0 20px;">Wavelength</h2>
        <p id="author" style="color:var(--gold); margin-top:10px; letter-spacing:1px;">READY TO PLAY</p>
        
        <div style="display:flex; align-items:center; gap:40px; margin-top:40px;">
            <button onclick="changeTrack(-1)" style="background:none; border:none; color:white; font-size:35px; cursor:pointer;">⏮</button>
            <button class="play-pause" id="ppBtn" onclick="togglePlay()">▶</button>
            <button onclick="changeTrack(1)" style="background:none; border:none; color:white; font-size:35px; cursor:pointer;">⏭</button>
        </div>
    </main>

    <aside id="sidebar">
        <div class="sidebar-controls">
            <h3 style="margin:0; font-weight: 500;">Search Results</h3>
            <button class="btn-close" onclick="closeSidebar()">✕</button>
        </div>
        <div id="results-list" style="flex:1; overflow-y:auto; padding:15px;">
            <p style="text-align:center; opacity:0.4; margin-top:50px;">Nothing here yet.</p>
        </div>
    </aside>

    <script>
        const $ = id => document.getElementById(id);
        const audio = new Audio();
        let queue = [], curIdx = -1;

        async function checkHealth() {
            try {
                const res = await fetch('/health');
                if (res.ok) $('health-dot').classList.add('online');
            } catch(e) { $('health-dot').classList.remove('online'); }
        }
        setInterval(checkHealth, 5000);
        checkHealth();

        // Open/Close Sidebar
        const openSidebar = () => { 
            $('sidebar').classList.add('open'); 
            $('overlay').classList.add('active'); 
        };
        const closeSidebar = () => { 
            $('sidebar').classList.remove('open'); 
            $('overlay').classList.remove('active'); 
        };
        
        // Clicks on the dark overlay also close the sidebar
        $('overlay').onclick = closeSidebar;

        async function search() {
            const q = $('query').value;
            if (!q) return;
            $('results-list').innerHTML = '<p style="text-align:center; margin-top:50px;">Searching...</p>';
            try {
                const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
                queue = await res.json();
                $('results-list').innerHTML = queue.map((t, i) => `
                    <div class="track-item" onclick="playIdx(${i})">
                        <img src="${t.thumb}">
                        <div style="overflow:hidden">
                            <div style="white-space:nowrap; text-overflow:ellipsis; overflow:hidden; font-size:14px; font-weight:bold;">${t.title}</div>
                            <div style="font-size:12px; opacity:0.6; margin-top:3px;">${t.author}</div>
                        </div>
                    </div>
                `).join('');
                openSidebar();
            } catch(e) {
                $('results-list').innerHTML = '<p style="text-align:center; color:#ff6b6b;">Failed to connect.</p>';
            }
        }

        function playIdx(idx) {
    if (idx < 0 || idx >= queue.length) return;
    curIdx = idx;
    const t = queue[idx];
    
    // 1. Immediate UI feedback
    $('title').innerText = t.title;
    $('author').innerText = t.author;
    $('cover').src = t.thumb;
    $('blurBg').style.backgroundImage = `url(${t.thumb})`;
    $('ppBtn').innerText = "⏳"; // Show loading state

    // 2. CRITICAL IOS FIX: 
    // We must reset and load() the audio object within the same execution thread as the click
    audio.pause();
    audio.src = `/stream?videoId=${t.id}`;
    audio.load(); // Forces the browser to start plumbing the connection immediately
    
    // 3. Play returns a promise, we use it to update the icon
    audio.play().then(() => {
        $('ppBtn').innerText = "⏸";
    }).catch(e => {
        console.error("Playback failed", e);
        $('ppBtn').innerText = "▶";
    });
    
    if (window.innerWidth < 1000) closeSidebar();
}

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) { audio.play(); $('ppBtn').innerText = "⏸"; }
            else { audio.pause(); $('ppBtn').innerText = "▶"; }
        }

        function changeTrack(dir) { playIdx(curIdx + dir); }

        $('query').addEventListener('keydown', e => {
            if (e.key === 'Enter') { search(); $('query').blur(); }
        });

        audio.onended = () => changeTrack(1);
    </script>
</body>
</html>
