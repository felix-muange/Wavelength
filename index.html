<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wavelength</title>
    <style>
        :root { 
            --bg: #0a0a0c; 
            --gold: #c9a96e; 
            --text: #ffffff; 
            --card: rgba(255, 255, 255, 0.08); 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: -apple-system, system-ui, sans-serif; 
            height: 100dvh; width: 100vw; overflow: hidden;
        }

        /* 1. LAYER: Background */
        .blur-bg { 
            position: fixed; inset: 0; z-index: 1; 
            background-size: cover; background-position: center; 
            filter: blur(80px) brightness(0.2); opacity: 0.6; pointer-events: none; 
        }

        /* 2. LAYER: Main Player (Passthrough clicks) */
        main { 
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none; /* Clicks go through this layer to the search bar */
            padding-top: 60px;
        }

        .player-controls { pointer-events: auto; display: flex; flex-direction: column; align-items: center; }
        #cover { width: min(70vw, 300px); height: min(70vw, 300px); border-radius: 24px; object-fit: cover; box-shadow: 0 20px 50px #000; margin-bottom: 25px; }

        /* 3. LAYER: Header (The Interactive Shell) */
        header { 
            position: fixed; top: 0; left: 0; right: 0; 
            z-index: 9999; /* Highest priority */
            padding: env(safe-area-inset-top, 20px) 20px 10px;
            display: flex; gap: 12px; align-items: center;
            pointer-events: auto; /* Force clickability */
            background: linear-gradient(to bottom, rgba(10,10,12,0.9), transparent);
        }

        .search-box { 
            flex: 1; display: flex; background: var(--card); border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.15); padding: 4px 15px; 
            backdrop-filter: blur(20px); pointer-events: auto;
        }

        input { 
            flex: 1; background: none; border: none; color: white; padding: 12px 0; 
            font-size: 16px; outline: none; width: 100%;
            pointer-events: auto !important; /* Critical Fix */
        }

        /* 4. LAYER: Sidebar & Overlay */
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 5000; }
        #overlay.active { opacity: 1; pointer-events: auto; }

        #sidebar { 
            position: fixed; top: 0; right: 0; bottom: 0; width: 85%; max-width: 400px; 
            background: #0f0f11; z-index: 6000; transform: translateX(100%); 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; 
        }
        #sidebar.open { transform: translateX(0); }

        /* Helpers */
        .play-pause { width: 80px; height: 80px; border-radius: 50%; background: var(--gold); border: none; font-size: 30px; cursor: pointer; }
        .track-item { display: flex; align-items: center; gap: 12px; padding: 15px; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,0.03); margin-bottom: 8px; }
        .track-item img { width: 50px; height: 50px; border-radius: 8px; }
        #health-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
        .online { background: #4caf50 !important; }
    </style>
</head>
<body>

    <div class="blur-bg" id="blurBg"></div>
    <div id="overlay"></div>

    <header>
        <div id="health-dot"></div>
        <div class="search-box">
            <input type="text" id="query" placeholder="Search..." autocomplete="off" enterkeyhint="search">
            <button onclick="search()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">🔍</button>
        </div>
        <button onclick="openSidebar()" style="background:none; border:none; color:var(--gold); font-size:28px; cursor:pointer;">☰</button>
    </header>

    <main>
        <div class="player-controls">
            <img id="cover" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <h2 id="title" style="margin:0; text-align:center;">Wavelength</h2>
            <p id="author" style="color:var(--gold); margin-top:10px;">Ready to play</p>
            
            <div style="display:flex; align-items:center; gap:40px; margin-top:40px;">
                <button onclick="changeTrack(-1)" style="background:none; border:none; color:white; font-size:35px; cursor:pointer;">⏮</button>
                <button class="play-pause" id="ppBtn" onclick="togglePlay()">▶</button>
                <button onclick="changeTrack(1)" style="background:none; border:none; color:white; font-size:35px; cursor:pointer;">⏭</button>
            </div>
        </div>
    </main>

    <aside id="sidebar">
        <div style="padding: 60px 20px 20px; border-bottom: 1px solid #222; display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0">Library</h3>
            <button onclick="closeSidebar()" style="background:none; border:none; color:white; font-size:30px; cursor:pointer;">✕</button>
        </div>
        <div id="results-list" style="flex:1; overflow-y:auto; padding:15px;"></div>
    </aside>

    <script>
        const $ = id => document.getElementById(id);
        const audio = new Audio();
        let queue = [], curIdx = -1;

        async function checkHealth() {
            try { const res = await fetch('/health'); if(res.ok) $('health-dot').classList.add('online'); } 
            catch(e) { $('health-dot').classList.remove('online'); }
        }
        setInterval(checkHealth, 5000); checkHealth();

        const openSidebar = () => { $('sidebar').classList.add('open'); $('overlay').classList.add('active'); };
        const closeSidebar = () => { $('sidebar').classList.remove('open'); $('overlay').classList.remove('active'); };
        $('overlay').onclick = closeSidebar;

        async function search() {
            const q = $('query').value; if(!q) return;
            $('query').blur();
            $('results-list').innerHTML = '<p style="text-align:center; margin-top:50px;">Searching...</p>';
            const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
            queue = await res.json();
            $('results-list').innerHTML = queue.map((t, i) => `
                <div class="track-item" onclick="playIdx(${i})">
                    <img src="${t.thumb}">
                    <div style="overflow:hidden">
                        <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${t.title}</div>
                        <div style="font-size:12px; opacity:0.6;">${t.author}</div>
                    </div>
                </div>
            `).join('');
            openSidebar();
        }

        function playIdx(idx) {
            if(idx < 0 || idx >= queue.length) return;
            curIdx = idx; const t = queue[idx];
            $('title').innerText = t.title; $('author').innerText = t.author;
            $('cover').src = t.thumb; $('blurBg').style.backgroundImage = `url(${t.thumb})`;
            $('ppBtn').innerHTML = '<small>...</small>';
            
            audio.pause();
            audio.src = `/stream?videoId=${t.id}`;
            audio.load();
            audio.play().then(() => $('ppBtn').innerText = "⏸").catch(() => $('ppBtn').innerText = "▶");

            if(window.innerWidth < 1000) closeSidebar();
        }

        function togglePlay() {
            if(!audio.src) return;
            if(audio.paused) { audio.play(); $('ppBtn').innerText = "⏸"; }
            else { audio.pause(); $('ppBtn').innerText = "▶"; }
        }

        function changeTrack(dir) { playIdx(curIdx + dir); }
        $('query').addEventListener('keydown', e => { if(e.key === 'Enter') search(); });
        audio.onended = () => changeTrack(1);
    </script>
</body>
</html>
