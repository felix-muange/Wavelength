<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#e8c98a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0c" stroke="#c9a96e" stroke-width="6"/>
  <!-- Sound wave bars (W shape) -->
  <rect x="92" y="320" width="22" height="60" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="126" y="280" width="22" height="100" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="160" y="240" width="22" height="140" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="194" y="200" width="22" height="180" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="228" y="160" width="22" height="220" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="262" y="160" width="22" height="220" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="296" y="200" width="22" height="180" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="330" y="240" width="22" height="140" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="364" y="280" width="22" height="100" rx="4" fill="url(#g)" filter="url(#glow)"/>
  <rect x="398" y="320" width="22" height="60" rx="4" fill="url(#g)" filter="url(#glow)"/>
</svg>